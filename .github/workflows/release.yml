name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: jpp-macos-arm64
            cc: clang
          - os: macos-13
            name: jpp-macos-x86_64
            cc: clang
          - os: ubuntu-latest
            name: jpp-linux-x86_64
            cc: gcc
          - os: windows-latest
            name: jpp-windows-x86_64.exe
            cc: gcc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra -pedantic -o ${{ matrix.name }} jpp.c

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: Build ${{ steps.sha.outputs.short }}
          body: |
            Automated build from commit ${{ github.sha }}.
          files: |
            artifacts/jpp-macos-arm64/jpp-macos-arm64
            artifacts/jpp-macos-x86_64/jpp-macos-x86_64
            artifacts/jpp-windows-x86_64.exe/jpp-windows-x86_64.exe

